var $ = function(s){ return document.querySelector(s); };
function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
function hex(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0" + x.toString(16)).slice(-2); }).join(""); }
function dire(t, cl){ $("#cpm").className = "cp-m " + (cl || ""); $("#cpm").textContent = t; }
async function ouvrir(){
  var code = $("#cpcode").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!code) { dire("Tapez votre code.", "non"); return; }
  if (!window.crypto || !crypto.subtle) { dire("Ce navigateur ne peut pas ouvrir le dossier. Essayez avec un autre.", "non"); return; }
  $("#cpok").disabled = true; dire("Vérification…");

    if (!o) { dire("Ce code n’est pas reconnu. Vérifiez-le sur votre étiquette.", "non"); $("#cpok").disabled = false; return; }

                                            mat, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    var lien = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(o.i)}, cle, b64(o.d)));
    dire("Code reconnu : votre dossier s’ouvre…", "oui");
    location.href = lien;
  } catch (x) {
    dire("Le dossier n’a pas pu s’ouvrir. Réessayez.", "non"); $("#cpok").disabled = false;

}
